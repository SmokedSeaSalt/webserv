server {
    listen 127.0.0.1:39077;
    client_max_body_size 10000;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    location /assets {
        methods GET HEAD;
        root /assets;
        index index.html;
        autoindex on;
    }

    location /upload {
        methods POST DELETE;
        upload_store /assets/uploads;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /scripts {
        methods GET;
        root /var/www/cgi;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
    }
}
