server {
    listen 127.0.0.1:8080;
    client_max_body_size 1000;

    error_page 404 assets/errors/404.html;
    error_page 500 assets/errors/500.html;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    location /assets {
        methods GET HEAD;
        root /assets;
        index index.html;
        autoindex on;
    }

    location /upload {
        methods POST DELETE;
        upload_store /assets/uploads;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /cgi-bin {
        methods GET POST;
        root /cgi-bin;
        cgi .sh /usr/bin/sh;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
    }
}
