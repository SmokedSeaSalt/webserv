server {
    listen 127.0.0.1:8080;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    location /scripts {
        methods GET POST;
        root /var/www/cgi;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
    }
}