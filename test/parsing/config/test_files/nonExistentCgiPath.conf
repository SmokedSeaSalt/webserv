server {
    listen 127.0.0.1:8080;
    client_max_body_size 10000;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    location /scripts {
        methods GET POST;
        root /var/www/cgi;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python300000000;
    }
}