server {
    listen 127.0.0.1:8080;
    client_max_body_size 10000;



    location / {
        methods GET HEAD;
        root /test/execution/non-CGI/assets;
        index index.html;
        autoindex off;
    }

    location /testlocation {
        methods POST DELETE;
        upload_store /test/execution/non-CGI/assets;
    }

    // comment the above will only work if POST and DELETE are executed using absoluteUploadStorePath instead of the other abs path in the HTTPMessage.
}