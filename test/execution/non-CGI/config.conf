server {
    listen 127.0.0.1:8080;
    client_max_body_size 10000;

    error_page 404 /test/execution/non-CGI/assets/errors/404.html;
    error_page 405 /test/execution/non-CGI/assets/errors/405.html;


    location / {
        methods GET HEAD;
        root /test/execution/non-CGI/assets;
        index index.html;
        autoindex off;
    }

    location /testlocation {
        methods POST DELETE;
        upload_store /test/execution/non-CGI/assets;
    }
}