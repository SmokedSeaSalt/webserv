server {
    listen 127.0.0.1:8080;
    client_max_body_size 100;

    error_page 404 /assets/errors/404.html;
    error_page 405 /assets/errors/405.html;
    error_page 500 /assets/errors/500.html;


    location / {
        methods GET;
        root /assets;
        autoindex off;
    }

	location /directory {
        methods GET;
        root /YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
    }

    location /post_body {
        methods POST;
        upload_store /assets/uploads;
    }

    location /cgi-bin {
        methods GET POST;
        root /cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
        cgi .sh /usr/bin/sh;
		cgi .bla /workspaces/webserv/cgi_tester;
    }
}